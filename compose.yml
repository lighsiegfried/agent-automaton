# Optional support services ONLY.
#
# Docker CANNOT control the Windows desktop — containers have no access to the
# user session, windows, keyboard, mouse, or installed apps. Real automation
# always runs directly on the Windows host; the code enforces this too
# (real_windows_tools_enabled() requires a Windows host).
# See docs/ARCHITECTURE.md ("Windows host vs Docker").
#
# Convention: this file is named compose.yml, never docker-compose.yml.
#
# Services:
#   api          — the FastAPI app in SIMULATED mode (default profile)
#   ollama       — local LLM inference for the planner/response generator
#                  (profile "llm": docker compose --profile llm up -d ollama)
#   model-keeper — keeps the configured model loaded in Ollama (Phase 3D.1):
#                  after any Ollama restart it re-warms the model with
#                  keep_alive=-1 so Fifi never answers from a cold GPU.

services:
  api:
    build: .
    # Profile-gated (Phase 3D.0.1): an implicit `docker compose up -d` used to
    # start this simulated API on port 8000, shadowing the REAL host API and
    # confusing the runtime manager. Opt in explicitly when you want it:
    #   docker compose --profile sim up -d api
    profiles:
      - sim
    ports:
      - "8000:8000"
    environment:
      # Hard-pinned: real execution is impossible in a container anyway
      # (the code also requires a Windows host), but be explicit.
      ENABLE_REAL_WINDOWS_TOOLS: "false"

  ollama:
    image: ollama/ollama:latest
    profiles:
      - llm
    # Persistent local runtime (Phase 3B.7): keep Ollama up across reboots so
    # Fifi's LLM backend is always ready. Models survive in the named volume;
    # scripts/local_runtime.py stop leaves this running by default.
    restart: unless-stopped
    ports:
      # localhost only — never exposed to the network
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      # Persistent warm runtime (Phase 3D.1): one model, loaded once, kept in
      # VRAM forever. -1 disables idle unloading; single model / no parallel
      # requests keeps the 7B planner+response model resident on the 16 GB GPU.
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    # GPU-first by default (Docker Desktop + WSL2 + NVIDIA driver). If the GPU
    # is unavailable, `up` fails loudly — CPU inference is opt-in only via
    # ALLOW_CPU_OLLAMA=true, enforced by scripts/docker_llm.py.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Tiny watchdog (Phase 3D.1): re-warms the configured model after an Ollama
  # restart so no manual interaction is ever needed. It only ever calls the
  # Ollama HTTP API (/api/ps, /api/generate) — it cannot touch volumes, models
  # on disk, or the Windows host.
  model-keeper:
    image: curlimages/curl:8.11.1
    profiles:
      - llm
    restart: unless-stopped
    depends_on:
      - ollama
    environment:
      KEEPER_MODEL: ${LLM_PLANNER_MODEL:-qwen2.5:7b}
      KEEPER_CHECK_SECONDS: ${MODEL_KEEPER_CHECK_SECONDS:-60}
      KEEPER_OLLAMA_URL: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "model-keeper: keeping $$KEEPER_MODEL loaded (check every $${KEEPER_CHECK_SECONDS}s)"
        while true; do
          if ! curl -sf "$$KEEPER_OLLAMA_URL/api/ps" | grep -q "\"name\":\"$$KEEPER_MODEL\""; then
            echo "model-keeper: $$KEEPER_MODEL is not loaded — warming with keep_alive=-1"
            curl -sf -X POST "$$KEEPER_OLLAMA_URL/api/generate" \
              -H "Content-Type: application/json" \
              -d "{\"model\":\"$$KEEPER_MODEL\",\"keep_alive\":-1}" > /dev/null \
              || echo "model-keeper: warm request failed (ollama may still be starting)"
          fi
          sleep "$$KEEPER_CHECK_SECONDS"
        done

  # Fifi Voice Lab worker (Phase 3D.x) — the ONLY containerized part of the
  # Voice Lab. Isolated image (voice_lab/Dockerfile), GPU-enabled with the SAME
  # NVIDIA reservation as Ollama. Bound to loopback only; the main HOST API
  # talks to it over http://127.0.0.1:8766 exactly as it does the host worker.
  # It never touches the microphone/keyboard/mouse or Windows apps: playback and
  # Windows SAPI are disabled here (host-only), and models load from the seeded
  # `voice-lab-models` volume — never downloaded, never baked into the image.
  #   docker compose --profile voice up -d voice-lab
  voice-lab:
    build:
      context: .
      dockerfile: voice_lab/Dockerfile
    image: fifi-voice-lab:latest
    profiles:
      - voice
    restart: unless-stopped
    # Reap child processes and forward signals — torch/CUDA can leave zombies,
    # which would otherwise block a clean `restart`/`up --force-recreate`.
    init: true
    ports:
      # localhost only — never exposed to the network (mirrors the host worker).
      - "127.0.0.1:8766:8766"
    environment:
      # HF cache -> the mounted volume, so every model load reads the seeded
      # weights and downloads nothing.
      HF_HOME: /models/hf
      HF_HUB_CACHE: /models/hf/hub
      HUGGINGFACE_HUB_CACHE: /models/hf/hub
      VOICE_LAB_HOST: 0.0.0.0
      VOICE_LAB_PORT: "8766"
      # Never touch host audio devices; the Windows fallback lives in the main
      # host API, not in this Linux worker.
      VOICE_LAB_PLAYBACK_ENABLED: "false"
      VOICE_LAB_DISABLE_SAPI: "true"
      # Cold loads from the mounted volume (WSL2 filesystem, first read) are
      # slower than a host SSD, so give the soft model-load timeout more room in
      # Docker mode — the load is never force-killed, this just stops a healthy
      # cold load being reported as a timeout.
      VOICE_LAB_MODEL_LOAD_TIMEOUT_SECONDS: "900"
      # GPU passthrough, identical to the Ollama service.
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      # Model weights live ONLY in this named volume after migration.
      - voice-lab-models:/models/hf
      # Shared integration state, read-write so profile selection persists to
      # the host and generated previews/identities stay accessible there.
      - ./config/voices:/srv/agent-automaton/config/voices
      - ./voice_lab/storage:/srv/agent-automaton/voice_lab/storage
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8766/health', timeout=5).status==200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8766"]
    # Same NVIDIA reservation as Ollama.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # One-shot migration (profile "voice-seed"): copy the existing host HF cache
  # into the `voice-lab-models` volume WITHOUT the network, so the ~14 GB of
  # weights are never re-downloaded. The host cache is mounted read-only; the
  # copy is atomic-marked and idempotent (skips when already seeded).
  #   docker compose --profile voice-seed up voice-model-seed
  voice-model-seed:
    image: python:3.12-slim
    profiles:
      - voice-seed
    # Hard guarantee that the seed can never hit the network.
    network_mode: none
    volumes:
      - ./voice_lab/models/hf:/seed/hf:ro          # existing host cache (read-only)
      - voice-lab-models:/models/hf                 # destination volume
      - ./voice_lab/docker/seed_models.py:/seed/seed_models.py:ro
      - ./voice_lab/models.json:/config/models.json:ro
    entrypoint: ["python", "/seed/seed_models.py"]

  # Escape hatch (profile "voice-download"): on a machine with NO local cache to
  # migrate, download ONLY the missing configured models straight into the
  # volume using the official Hugging Face cache API. Model ids come from the
  # shared voice_lab/models.json — never duplicated in code. Reuses the Voice
  # Lab image (it already has huggingface_hub).
  #   docker compose --profile voice-download up voice-model-download
  voice-model-download:
    build:
      context: .
      dockerfile: voice_lab/Dockerfile
    image: fifi-voice-lab:latest
    profiles:
      - voice-download
    environment:
      HF_HOME: /models/hf
      HF_HUB_CACHE: /models/hf/hub
      HUGGINGFACE_HUB_CACHE: /models/hf/hub
      VOICE_LAB_MODELS_CONFIG: /config/models.json
    volumes:
      - voice-lab-models:/models/hf
      - ./voice_lab/docker/download_models.py:/download_models.py:ro
      - ./voice_lab/models.json:/config/models.json:ro
    entrypoint: ["python", "/download_models.py"]

volumes:
  ollama-models:
  voice-lab-models:
